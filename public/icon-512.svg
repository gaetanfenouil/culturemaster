<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="90" fill="#1a1a2e"/>

  <!-- Base steps -->
  <rect x="136" y="362" width="240" height="14" rx="3" fill="#c9a84c"/>
  <rect x="120" y="371" width="272" height="10" rx="2" fill="#a8873a"/>

  <!-- Stylobate (top platform) -->
  <rect x="144" y="350" width="224" height="18" rx="3" fill="#c9a84c"/>

  <!-- 4 columns -->
  <rect x="170" y="186" width="22" height="164" rx="4" fill="#e8d4a0"/>
  <rect x="176" y="189" width="10" height="161" rx="2" fill="#f5e6b8"/>

  <rect x="216" y="186" width="22" height="164" rx="4" fill="#e8d4a0"/>
  <rect x="222" y="189" width="10" height="161" rx="2" fill="#f5e6b8"/>

  <rect x="274" y="186" width="22" height="164" rx="4" fill="#e8d4a0"/>
  <rect x="280" y="189" width="10" height="161" rx="2" fill="#f5e6b8"/>

  <rect x="320" y="186" width="22" height="164" rx="4" fill="#e8d4a0"/>
  <rect x="326" y="189" width="10" height="161" rx="2" fill="#f5e6b8"/>

  <!-- Entablature -->
  <rect x="152" y="178" width="208" height="16" rx="3" fill="#dcc87a"/>

